<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simoni's Portfolio</title>
    <meta name="description" content="Simoni Sawant – CSE Student, Web Developer & Tech Enthusiast. Select a profile to explore." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #141414;
        color: #fff;
        font-family: 'Outfit', sans-serif;
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* ─── Noise texture overlay ─── */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
      }

      /* ─── Header / Logo ─── */
      header {
        position: relative;
        z-index: 10;
        padding: 28px 48px;
      }

      .netflix-logo {
        font-size: 2.2rem;
        font-weight: 700;
        letter-spacing: -1px;
        color: #E50914;
        text-transform: uppercase;
        user-select: none;
        text-shadow: 0 0 30px rgba(229, 9, 20, 0.5);
      }

      /* ─── Main container ─── */
      main {
        position: relative;
        z-index: 10;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 60px;
        padding: 20px;
      }

      /* ─── Title ─── */
      .who-title {
        font-size: clamp(2rem, 4vw, 3.4rem);
        font-weight: 300;
        letter-spacing: 0.08em;
        color: #fff;
        text-align: center;
        opacity: 0;
        transform: translateY(-20px);
        animation: fadeDown 0.7s ease 0.3s forwards;
      }

      /* ─── Profile grid ─── */
      .profiles-grid {
        display: flex;
        gap: 36px;
        flex-wrap: wrap;
        justify-content: center;
        opacity: 0;
        animation: fadeUp 0.7s ease 0.6s forwards;
      }

      /* ─── Single profile card ─── */
      .profile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        cursor: pointer;
        text-decoration: none;
        color: #aaa;
      }

      .profile-avatar-wrap {
        width: 140px;
        height: 140px;
        border-radius: 8px;
        overflow: hidden;
        border: 3px solid transparent;
        transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
        position: relative;
      }

      .profile-avatar-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.3s ease;
      }

      .profile:hover .profile-avatar-wrap {
        border-color: #fff;
        transform: scale(1.08);
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
      }

      .profile:hover .profile-avatar-wrap img {
        transform: scale(1.05);
      }

      .profile:hover .profile-name {
        color: #fff;
      }

      .profile-name {
        font-size: 1rem;
        font-weight: 400;
        letter-spacing: 0.05em;
        transition: color 0.25s ease;
      }

      /* ─── Placeholder profiles (coming soon) ─── */
      .profile-placeholder .profile-avatar-wrap {
        background: linear-gradient(135deg, #1a1a2e 0%, #2d1b4e 50%, #1a1a2e 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3.5rem;
      }

      .profile-placeholder:hover .profile-avatar-wrap {
        border-color: #888;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.08);
      }

      /* ─── Manage Profiles button ─── */
      .manage-btn {
        opacity: 0;
        animation: fadeUp 0.7s ease 0.9s forwards;
        padding: 10px 30px;
        font-size: 1rem;
        font-weight: 400;
        letter-spacing: 0.1em;
        color: #aaa;
        background: transparent;
        border: 1.5px solid #aaa;
        border-radius: 3px;
        cursor: pointer;
        font-family: 'Outfit', sans-serif;
        transition: color 0.2s, border-color 0.2s, background 0.2s;
      }

      .manage-btn:hover {
        color: #fff;
        border-color: #fff;
        background: rgba(255,255,255,0.06);
      }

      /* ─── Click animation overlay ─── */
      .click-overlay {
        position: fixed;
        inset: 0;
        background: #141414;
        opacity: 0;
        pointer-events: none;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }

      .click-overlay.active {
        opacity: 1;
        pointer-events: all;
      }

      /* ─── Keyframes ─── */
      @keyframes fadeDown {
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes fadeUp {
        to { opacity: 1; transform: translateY(0); }
        from { transform: translateY(20px); }
      }

      /* ─── Responsive ─── */

      /* Large tablets / small laptops */
      @media (max-width: 1024px) {
        header { padding: 24px 36px; }
        .profiles-grid { gap: 30px; }
        .profile-avatar-wrap { width: 130px; height: 130px; }
      }

      /* Tablets */
      @media (max-width: 768px) {
        header { padding: 20px 24px; }
        .netflix-logo { font-size: 1.8rem; }
        .who-title { font-size: clamp(1.6rem, 5vw, 2.4rem); }
        .profiles-grid { gap: 24px; }
        .profile-avatar-wrap { width: 115px; height: 115px; }
        main { gap: 40px; }
        .manage-btn { font-size: 0.9rem; padding: 8px 24px; }
      }

      /* Mobile phones */
      @media (max-width: 600px) {
        body { overflow-y: auto; overflow-x: hidden; }
        header { padding: 16px 20px; }
        .netflix-logo { font-size: 1.5rem; }
        .who-title { font-size: clamp(1.3rem, 6vw, 1.8rem); letter-spacing: 0.04em; }
        main { gap: 32px; padding: 16px; justify-content: flex-start; padding-top: 10vh; }
        .profiles-grid { gap: 20px; }
        .profile-avatar-wrap { width: 90px; height: 90px; border-radius: 6px; }
        .profile-name { font-size: 0.85rem; }
        .manage-btn { font-size: 0.85rem; padding: 8px 20px; }
      }

      /* Very small phones */
      @media (max-width: 400px) {
        header { padding: 14px 16px; }
        main { padding-top: 8vh; }
        .profiles-grid { gap: 16px; }
        .profile-avatar-wrap { width: 75px; height: 75px; }
        .profile-name { font-size: 0.78rem; }
        .profile { gap: 8px; }
      }

      /* Touch-friendly: disable parallax on touch devices */
      @media (hover: none) and (pointer: coarse) {
        .profile:hover .profile-avatar-wrap {
          border-color: transparent;
          transform: none;
          box-shadow: none;
        }
        .profile:active .profile-avatar-wrap {
          border-color: #fff;
          transform: scale(1.05);
          box-shadow: 0 0 20px rgba(255, 255, 255, 0.12);
        }
      }

      /* ─── NETFLIX ANIMATED INTRO ─── */
      .netflix-intro {
        position: fixed;
        inset: 0;
        z-index: 100000;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: opacity 0.65s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
      }

      .netflix-intro.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .intro-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .intro-flare {
        position: absolute;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        background: radial-gradient(circle at center, rgba(229, 9, 20, 0.5) 0%, rgba(229, 9, 20, 0.15) 40%, transparent 70%);
        opacity: 0;
        transform: scale(0.6);
        transition: opacity 0.5s ease, transform 0.8s ease;
      }

      .intro-flare.active {
        opacity: 1;
        transform: scale(1.8);
      }

      .intro-content {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      .intro-logo {
        font-family: 'Bebas Neue', 'Outfit', sans-serif;
        font-size: clamp(4.5rem, 15vw, 11rem);
        font-weight: 900;
        letter-spacing: clamp(0.08em, 1.8vw, 0.22em);
        display: flex;
        justify-content: center;
        align-items: center;
        user-select: none;
        background: linear-gradient(180deg, #ff2a34 0%, #E50914 45%, #b30710 80%, #660004 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 35px rgba(229, 9, 20, 0.7)) drop-shadow(0 15px 35px rgba(0, 0, 0, 0.9));
        transform: scale(0.85);
        opacity: 0;
        transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease, filter 0.6s ease;
        will-change: transform, opacity, filter;
      }

      .intro-logo.reveal {
        opacity: 1;
        transform: scale(1.04);
        filter: drop-shadow(0 0 50px rgba(229, 9, 20, 0.95)) drop-shadow(0 0 90px rgba(255, 40, 40, 0.6));
      }

      .intro-logo.hyper-zoom {
        transform: scale(18);
        opacity: 0;
        filter: drop-shadow(0 0 100px rgba(255, 255, 255, 1));
        transition: transform 1.15s cubic-bezier(0.7, 0, 0.84, 0), opacity 0.9s cubic-bezier(0.7, 0, 0.84, 0);
      }

      /* Netflix curved arch letters */
      .intro-letter {
        display: inline-block;
        transition: transform 0.3s ease;
      }
      .intro-letter.l-s { transform: translateY(5px) rotate(-1.8deg); }
      .intro-letter.l-i1 { transform: translateY(1.5px) rotate(-0.8deg); }
      .intro-letter.l-m { transform: translateY(0); }
      .intro-letter.l-o { transform: translateY(0); }
      .intro-letter.l-n { transform: translateY(1.5px) rotate(0.8deg); }
      .intro-letter.l-i2 { transform: translateY(5px) rotate(1.8deg); }

      /* Intro controls */
      .intro-controls {
        position: absolute;
        bottom: 30px;
        right: 36px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .intro-btn {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #fff;
        padding: 8px 16px;
        border-radius: 4px;
        font-family: 'Outfit', sans-serif;
        font-size: 0.85rem;
        letter-spacing: 0.05em;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s, transform 0.2s;
      }

      .intro-btn:hover {
        background: rgba(255, 255, 255, 0.24);
        border-color: #fff;
        transform: scale(1.04);
      }

      /* Replay hover effect on header logo */
      .netflix-logo {
        cursor: pointer;
        transition: transform 0.2s, text-shadow 0.2s;
      }
      .netflix-logo:hover {
        transform: scale(1.04);
        text-shadow: 0 0 35px rgba(229, 9, 20, 0.9);
      }

      /* Synchronize landing page reveal with intro completion */
      body:not(.intro-done) header,
      body:not(.intro-done) .who-title,
      body:not(.intro-done) .profiles-grid,
      body:not(.intro-done) .manage-btn {
        opacity: 0 !important;
        animation: none !important;
      }

      body.intro-done header {
        animation: fadeIn 0.6s ease forwards;
      }
      body.intro-done .who-title {
        animation: fadeDown 0.7s ease 0.1s forwards;
      }
      body.intro-done .profiles-grid {
        animation: fadeUp 0.7s ease 0.3s forwards;
      }
      body.intro-done .manage-btn {
        animation: fadeIn 0.7s ease 0.5s forwards;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>

    <!-- ─── Netflix Animated Intro: SIMONI ─── -->
    <div id="netflixIntro" class="netflix-intro" role="banner" aria-label="SIMONI Netflix Intro">
      <canvas id="introCanvas" class="intro-canvas"></canvas>
      <div class="intro-flare" id="introFlare"></div>
      <div class="intro-content">
        <div class="intro-logo" id="introLogo">
          <span class="intro-letter l-s">S</span>
          <span class="intro-letter l-i1">I</span>
          <span class="intro-letter l-m">M</span>
          <span class="intro-letter l-o">O</span>
          <span class="intro-letter l-n">N</span>
          <span class="intro-letter l-i2">I</span>
        </div>
      </div>
      <div class="intro-controls">
        <button class="intro-btn" id="introSoundBtn" aria-label="Toggle Sound" title="Sound">🔊 Sound</button>
        <button class="intro-btn" id="introSkipBtn" aria-label="Skip Intro">Skip Intro &gt;</button>
      </div>
    </div>

    <!-- Fade-to-black overlay used on profile click -->
    <div class="click-overlay" id="clickOverlay"></div>

    <header>
      <div class="netflix-logo">SIMONI</div>
    </header>

    <main>
      <h1 class="who-title">Who's watching?</h1>

      <div class="profiles-grid" id="profilesGrid">

        <!-- ── Profile 1: Sim (you) ── -->
        <div class="profile" id="simProfile" role="button" tabindex="0" aria-label="Sim's profile – enter portfolio">
          <div class="profile-avatar-wrap">
            <img src="sim_avatar.jpg" alt="Sim" />
          </div>
          <span class="profile-name">Sim (myself)</span>
        </div>

        <!-- ── Profile 2: Web Developer ── -->
        <div class="profile profile-placeholder" id="webdevProfile" role="button" tabindex="0" aria-label="Web Developer profile – enter Netflix dashboard">
          <div class="profile-avatar-wrap">
            🚀
          </div>
          <span class="profile-name">Web Developer</span>
        </div>

        <!-- ── Profile 4: Programmer ── -->
        <div class="profile profile-placeholder" id="programmerProfile" role="button" tabindex="0" aria-label="Programmer profile – enter dashboard">
          <div class="profile-avatar-wrap">
            💻
          </div>
          <span class="profile-name">Programmer</span>
        </div>

        <!-- ── Profile 5: Designer ── -->
        <div class="profile profile-placeholder" id="designerProfile" role="button" tabindex="0" aria-label="Designer profile – enter dashboard">
          <div class="profile-avatar-wrap">
            🎨
          </div>
          <span class="profile-name">Designer</span>
        </div>

      </div>

      <button class="manage-btn" id="manageBtn">Manage Profiles</button>
    </main>

    <script>
      const simProfile        = document.getElementById('simProfile');
      const webdevProfile     = document.getElementById('webdevProfile');
      const programmerProfile = document.getElementById('programmerProfile');
      const designerProfile   = document.getElementById('designerProfile');
      const overlay           = document.getElementById('clickOverlay');

      function navigateTo(url) {
        overlay.classList.add('active');
        setTimeout(() => { window.location.href = url; }, 600);
      }

      // Sim profile → portfolio.html
      simProfile.addEventListener('click', () => navigateTo('portfolio.html'));
      simProfile.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navigateTo('portfolio.html'); }
      });

      // Web Developer profile → webdev.html
      webdevProfile.addEventListener('click', () => navigateTo('webdev.html'));
      webdevProfile.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navigateTo('webdev.html'); }
      });

      // Programmer profile → programmer.html
      programmerProfile.addEventListener('click', () => navigateTo('programmer.html'));
      programmerProfile.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navigateTo('programmer.html'); }
      });

      // Designer profile → designer.html
      designerProfile.addEventListener('click', () => navigateTo('designer.html'));
      designerProfile.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navigateTo('designer.html'); }
      });

      // Slight parallax tilt on mouse move (desktop only)
      const grid = document.getElementById('profilesGrid');
      if (!('ontouchstart' in window)) {
        document.addEventListener('mousemove', (e) => {
          const cx = window.innerWidth  / 2;
          const cy = window.innerHeight / 2;
          const dx = (e.clientX - cx) / cx;
          const dy = (e.clientY - cy) / cy;
          grid.style.transform = `perspective(800px) rotateY(${dx * 3}deg) rotateX(${-dy * 2}deg)`;
        });
      }

      // ═════════════════════════════════════════════════════════
      // NETFLIX ANIMATED INTRO CONTROLLER ("SIMONI")
      // ═════════════════════════════════════════════════════════
      const introEl       = document.getElementById('netflixIntro');
      const introLogo     = document.getElementById('introLogo');
      const introFlare    = document.getElementById('introFlare');
      const introCanvas   = document.getElementById('introCanvas');
      const introSkipBtn  = document.getElementById('introSkipBtn');
      const introSoundBtn = document.getElementById('introSoundBtn');
      const headerLogo    = document.querySelector('.netflix-logo');

      let audioCtx = null;
      let soundMuted = false;
      let introActive = true;
      let ribbonAnimationId = null;

      // Authentic Web Audio "TA-DUM" Synthesizer
      function playNetflixTaDum() {
        if (soundMuted) return;
        try {
          const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtxClass) return;
          if (!audioCtx) audioCtx = new AudioCtxClass();
          if (audioCtx.state === 'suspended') audioCtx.resume();

          const t0 = audioCtx.currentTime + 0.05;

          // 1. "Ta" - First sub strike
          const osc1 = audioCtx.createOscillator();
          const gain1 = audioCtx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(82, t0);
          osc1.frequency.exponentialRampToValueAtTime(32, t0 + 0.28);
          gain1.gain.setValueAtTime(0.85, t0);
          gain1.gain.exponentialRampToValueAtTime(0.001, t0 + 0.35);
          osc1.connect(gain1);
          gain1.connect(audioCtx.destination);
          osc1.start(t0);
          osc1.stop(t0 + 0.4);

          // 2. "Dum" - Heavy cinematic resonant thud
          const t1 = t0 + 0.24;
          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(68, t1);
          osc2.frequency.exponentialRampToValueAtTime(24, t1 + 0.9);
          gain2.gain.setValueAtTime(1.0, t1);
          gain2.gain.exponentialRampToValueAtTime(0.001, t1 + 1.25);
          osc2.connect(gain2);
          gain2.connect(audioCtx.destination);
          osc2.start(t1);
          osc2.stop(t1 + 1.35);

          // 3. Metallic hit / anvil harmonic sheen
          const oscMetal = audioCtx.createOscillator();
          const filterMetal = audioCtx.createBiquadFilter();
          const gainMetal = audioCtx.createGain();
          filterMetal.type = 'bandpass';
          filterMetal.frequency.value = 1150;
          filterMetal.Q.value = 5;
          oscMetal.type = 'sawtooth';
          oscMetal.frequency.setValueAtTime(230, t1);
          oscMetal.frequency.exponentialRampToValueAtTime(75, t1 + 0.5);
          gainMetal.gain.setValueAtTime(0.35, t1);
          gainMetal.gain.exponentialRampToValueAtTime(0.001, t1 + 0.65);
          oscMetal.connect(filterMetal);
          filterMetal.connect(gainMetal);
          gainMetal.connect(audioCtx.destination);
          oscMetal.start(t1);
          oscMetal.stop(t1 + 0.7);

          // 4. Cinematic bass drone swell
          const oscDrone = audioCtx.createOscillator();
          const filterDrone = audioCtx.createBiquadFilter();
          const gainDrone = audioCtx.createGain();
          filterDrone.type = 'lowpass';
          filterDrone.frequency.setValueAtTime(110, t1);
          filterDrone.frequency.exponentialRampToValueAtTime(420, t1 + 0.7);
          filterDrone.frequency.exponentialRampToValueAtTime(70, t1 + 1.8);
          oscDrone.type = 'sawtooth';
          oscDrone.frequency.setValueAtTime(55, t1); // A1 note
          gainDrone.gain.setValueAtTime(0.01, t1);
          gainDrone.gain.linearRampToValueAtTime(0.35, t1 + 0.15);
          gainDrone.gain.exponentialRampToValueAtTime(0.001, t1 + 1.9);
          oscDrone.connect(filterDrone);
          filterDrone.connect(gainDrone);
          gainDrone.connect(audioCtx.destination);
          oscDrone.start(t1);
          oscDrone.stop(t1 + 2.0);
        } catch (e) {
          // Autoplay policy fallback
        }
      }

      // ─── 3D Light Ribbon Spectrum Canvas ───
      const ctx = introCanvas.getContext('2d');
      let ribbons = [];
      let canvasActive = false;

      function resizeIntroCanvas() {
        introCanvas.width = window.innerWidth;
        introCanvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeIntroCanvas);
      resizeIntroCanvas();

      class SpectrumRibbon {
        constructor() {
          this.reset(true);
        }
        reset(randomZ = false) {
          const w = introCanvas.width;
          const h = introCanvas.height;
          this.x = (Math.random() - 0.5) * (w * 0.85);
          this.y = (Math.random() - 0.5) * (h * 0.35);
          this.z = randomZ ? Math.random() * 850 + 150 : 1000;
          this.width = Math.random() * 7 + 3;
          this.height = Math.random() * 260 + 140;
          this.speed = Math.random() * 28 + 22;
          const palette = [
            '#E50914', '#FF2A34', '#FF0055', '#D10029', // Netflix reds
            '#9D4EDD', '#8A2BE2', // Violet
            '#00F5D4', '#00BBF9', // Cyan
            '#FEE440', '#F72585', // Yellow / Magenta
            '#FFFFFF'             // White core
          ];
          this.color = palette[Math.floor(Math.random() * palette.length)];
          this.alpha = Math.random() * 0.65 + 0.35;
        }
        update() {
          this.z -= this.speed;
          if (this.z <= 8) {
            this.reset(false);
          }
        }
        draw(cx, cy) {
          const fov = 380;
          const scale = fov / Math.max(this.z, 1);
          const sx = cx + this.x * scale;
          const sy = cy + this.y * scale;
          const sw = this.width * scale;
          const sh = this.height * scale;

          ctx.save();
          ctx.globalAlpha = Math.min(1, this.alpha * (scale * 0.85));
          ctx.fillStyle = this.color;
          ctx.shadowBlur = Math.min(30, 16 * scale);
          ctx.shadowColor = this.color;
          ctx.fillRect(sx - sw / 2, sy - sh / 2, sw, sh);
          ctx.restore();
        }
      }

      function initRibbons() {
        ribbons = [];
        for (let i = 0; i < 75; i++) {
          ribbons.push(new SpectrumRibbon());
        }
      }

      function animateRibbons() {
        if (!canvasActive) return;
        ctx.clearRect(0, 0, introCanvas.width, introCanvas.height);
        ctx.globalCompositeOperation = 'screen';
        const cx = introCanvas.width / 2;
        const cy = introCanvas.height / 2;
        for (let r of ribbons) {
          r.update();
          r.draw(cx, cy);
        }
        ribbonAnimationId = requestAnimationFrame(animateRibbons);
      }

      // ─── Sequence Runner ───
      let timers = [];
      function runIntro() {
        introActive = true;
        introEl.classList.remove('fade-out');
        introEl.style.display = 'flex';
        introLogo.classList.remove('reveal', 'hyper-zoom');
        introFlare.classList.remove('active');
        document.body.classList.remove('intro-done');
        ctx.clearRect(0, 0, introCanvas.width, introCanvas.height);

        // Try sound
        playNetflixTaDum();

        // 1. Logo fades and gently scales in
        timers.push(setTimeout(() => {
          if (!introActive) return;
          introLogo.classList.add('reveal');
        }, 150));

        // 2. Flare and ribbon explosion burst
        timers.push(setTimeout(() => {
          if (!introActive) return;
          introFlare.classList.add('active');
          initRibbons();
          canvasActive = true;
          animateRibbons();
        }, 1100));

        // 3. Hyper-zoom into letters
        timers.push(setTimeout(() => {
          if (!introActive) return;
          introLogo.classList.add('hyper-zoom');
        }, 1900));

        // 4. Smooth cross-dissolve to profiles page
        timers.push(setTimeout(() => {
          if (!introActive) return;
          finishIntro();
        }, 2900));
      }

      function finishIntro() {
        if (!introActive) return;
        introActive = false;
        timers.forEach(t => clearTimeout(t));
        timers = [];
        introEl.classList.add('fade-out');
        document.body.classList.add('intro-done');

        setTimeout(() => {
          canvasActive = false;
          if (ribbonAnimationId) cancelAnimationFrame(ribbonAnimationId);
          introEl.style.display = 'none';
        }, 650);
      }

      // Skip & interaction events
      introSkipBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        finishIntro();
      });

      introSoundBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        soundMuted = !soundMuted;
        introSoundBtn.textContent = soundMuted ? '🔇 Muted' : '🔊 Sound';
        if (!soundMuted && introActive) {
          playNetflixTaDum();
        }
      });

      introEl.addEventListener('click', () => {
        finishIntro();
      });

      window.addEventListener('keydown', (e) => {
        if (introActive && (e.key === 'Escape' || e.key === ' ' || e.key === 'Enter')) {
          e.preventDefault();
          finishIntro();
        }
      });

      // Resume sound on first user touch if blocked by autoplay policy
      window.addEventListener('pointerdown', () => {
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }, { once: true });

      // Click "SIMONI" in header to replay intro
      if (headerLogo) {
        headerLogo.addEventListener('click', () => {
          runIntro();
        });
      }

      // Start intro on page load
      runIntro();
    </script>

  </body>
</html>
